<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Painting</title>
    <link rel="stylesheet" href="house.css">
</head>

<body>

    <div id="house">

        <div id="chimney">
            <div class="chimney-lines">
                <div class="line-1"></div>
                <div class="line-2"></div>
                <div class="line-3"></div>
                <div class="line-4"></div>
                <div class="line-5"></div>
                <div class="line-6"></div>
            </div>
        </div>

        <div id="roof">
            <div class="roof-lines"></div>
        </div>

        <div id="window-1">
            <div id="window-1-line"></div>
        </div>

        <div id="window-2">
            <div id="window-2-line"></div>
        </div>

        <div id="door">
            <div id="door-handle"></div>
        </div>

    </div>

    <div class="carpet">
        <i>WELCOME</i>
    </div>

</body>
</html>

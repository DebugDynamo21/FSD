<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Cottage</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="scene">

        <!-- Background -->
        <div class="sun"></div>

        <div class="cloud cloud-1">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="cloud cloud-2">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="tree">
            <div class="tree-trunk"></div>
            <div class="tree-leaves leaf-1"></div>
            <div class="tree-leaves leaf-2"></div>
            <div class="tree-leaves leaf-3"></div>
        </div>

        <!-- House -->
        <div id="house">

            <!-- Chimney -->
            <div id="chimney">
                <div class="chimney-top"></div>
                <div class="smoke smoke-1"></div>
                <div class="smoke smoke-2"></div>
            </div>

            <!-- Roof -->
            <div id="roof">
                <div class="roof-tile tile-1"></div>
                <div class="roof-tile tile-2"></div>
                <div class="roof-tile tile-3"></div>
                <div class="roof-tile tile-4"></div>
                <div class="roof-tile tile-5"></div>
                <div class="roof-tile tile-6"></div>
                <div class="roof-tile tile-7"></div>
                <div class="roof-tile tile-8"></div>
                <div class="roof-tile tile-9"></div>
            </div>

            <!-- Attic window -->
            <div class="attic-window">
                <div class="attic-glass"></div>
                <div class="attic-cross"></div>
            </div>

            <!-- Left window -->
            <div id="window-1">
                <div class="window-glass">
                    <div class="window-shine"></div>
                </div>
                <div class="window-cross vertical"></div>
                <div class="window-cross horizontal"></div>
                <div class="flower-box">
                    <span>🌷</span>
                    <span>🌼</span>
                    <span>🌷</span>
                </div>
            </div>

            <!-- Right window -->
            <div id="window-2">
                <div class="window-glass">
                    <div class="window-shine"></div>
                </div>
                <div class="window-cross vertical"></div>
                <div class="window-cross horizontal"></div>
                <div class="flower-box">
                    <span>🌼</span>
                    <span>🌷</span>
                    <span>🌼</span>
                </div>
            </div>

            <!-- Door -->
            <div id="door">

                <div class="door-panel panel-top"></div>
                <div class="door-panel panel-bottom"></div>

                <div id="door-handle"></div>

                <div class="door-wreath">
                    <span>🌿</span>
                    <span>🌸</span>
                </div>

                <div class="porch-light"></div>

            </div>

            <!-- Front steps -->
            <div class="steps step-1"></div>
            <div class="steps step-2"></div>

        </div>

        <!-- Flowers -->
        <div class="garden garden-left">
            <span>🌷</span>
            <span>🌼</span>
            <span>🌷</span>
            <span>🌱</span>
        </div>

        <div class="garden garden-right">
            <span>🌼</span>
            <span>🌷</span>
            <span>🌱</span>
            <span>🌼</span>
        </div>

        <!-- Welcome mat -->
        <div class="carpet">
            <span>WELCOME</span>
        </div>

    </div>

</body>
</html>
